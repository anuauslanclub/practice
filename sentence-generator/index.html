<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentence Generator</title>
    <link rel="icon" href="../assets/butterfly.ico">
    <link rel="stylesheet" href="../styles.css" type="text/css">
</head>

<body>
    <header>
        <h1>Sentence Generator</h1>
        <p>Click the button below for a random sentence to practice your Auslan!</p><p>You can practice by yourself, or sign the sentence to a partner and get them to translate it back into English!</p>
    </header>
    <main><button type="button" id="generator">💬</button>
        <section class="flex">
            <p class="center">Your sentence is...</p>
            <h2 class="center" id="sentence">I love Auslan!</h2>
        </section>
    </main>
    <script src="script.js"></script>
    <footer>
        <a href="../">
            <button type="button" class="button button-link">Return to home</button>
        </a>
    </footer>
</body>
